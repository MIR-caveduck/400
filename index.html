<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#200e20"><title>루체리 400일 축하해 🍓</title><style>
:root{color-scheme:dark;--gold:#f7d99b;--pink:#ffb2c9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 24%,#65334f 0%,#32162c 43%,#170e1c 85%);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#fff0e8;overflow-x:hidden}.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 25%,#ff94b012,transparent 30%),radial-gradient(circle at 80% 70%,#ffcb7812,transparent 35%)}.ambient:after{content:'✦　·　✧　·　✦　·　✧';position:absolute;top:9%;left:0;width:100%;text-align:center;letter-spacing:30px;color:#ffdcac3b;font-size:18px}.wrap{position:relative;text-align:center;width:min(95vw,690px);margin:auto;padding:46px 12px 50px}h1{font-family:Georgia,'Malgun Gothic',serif;letter-spacing:2px;font-size:clamp(25px,5.5vw,40px);margin:0 0 9px;color:var(--gold);text-shadow:0 0 26px #ed8fbb75}.sub{font-size:14px;color:#f9d2db;margin:0}.stage{position:relative;height:365px;display:grid;place-items:center;perspective:900px;transition:height .8s}.aura{position:absolute;width:320px;height:260px;border-radius:50%;background:radial-gradient(ellipse,#f6b1a03d,transparent 70%);filter:blur(14px);animation:breathe 3s ease-in-out infinite}.floor{position:absolute;bottom:31px;width:260px;height:40px;border-radius:50%;background:#07030890;filter:blur(16px)}.gift{position:relative;width:260px;height:250px;cursor:pointer;outline:none;transform-style:preserve-3d;filter:drop-shadow(0 22px 17px #0b031080);animation:float 3.4s ease-in-out infinite;transition:filter .3s}.gift:hover{filter:drop-shadow(0 27px 22px #080208a0) brightness(1.09)}.gift:focus-visible{outline:3px solid #ffe7ad;outline-offset:10px;border-radius:20px}
.box-front{position:absolute;left:28px;top:108px;width:204px;height:132px;border-radius:9px 9px 18px 18px;background:linear-gradient(100deg,#9b2b51 0%,#cb4771 48%,#a82d58 100%);border:2px solid #e789a4;box-shadow:inset 0 8px 14px #f5a2b233,inset 0 -16px 20px #57133066,0 15px 0 -8px #5c1537;z-index:3}
.box-front:before{content:'';position:absolute;left:81px;top:0;width:38px;height:100%;background:linear-gradient(90deg,#d7a455,#ffedb9 45%,#d19b4c);box-shadow:0 0 6px #5b183733}
.box-front:after{content:'';position:absolute;left:0;right:0;top:22px;height:1px;background:#ffd4dc44}
.seal{position:absolute;z-index:6;left:111px;top:158px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff1c4,#e3ae63 60%,#b9773d);border:2px solid #ffedc1;display:grid;place-items:center;font-size:21px;box-shadow:0 4px 9px #4d153780}
.lid{position:absolute;left:15px;top:82px;width:230px;height:51px;z-index:7;transform-origin:50% 80%}
.lid-front{position:absolute;inset:0;background:linear-gradient(105deg,#ae315e,#e56c90 50%,#ad315b);border:2px solid #ffb3c8;border-radius:10px;box-shadow:inset 0 -10px 9px #81204675,0 7px 8px #4d102d90}
.lid-front:after{content:'';position:absolute;left:95px;top:0;width:37px;height:100%;background:linear-gradient(90deg,#c9944d,#ffedb8 50%,#c9944d)}
.lid-top{display:none}
.bow{position:absolute;z-index:9;top:-45px;left:77px;width:76px;height:53px;filter:drop-shadow(0 4px 3px #642541)}
.bow:before,.bow:after{content:'';position:absolute;top:12px;width:45px;height:31px;border:5px solid #ffe4a4;background:linear-gradient(145deg,#ffefbb,#d8a15a);border-radius:65% 30% 65% 35%}
.bow:before{left:-8px;transform:rotate(24deg)}.bow:after{right:-8px;transform:rotate(-24deg)}
.knot{position:absolute;left:28px;top:22px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d5,#d7a052);z-index:2}
.tail{position:absolute;top:42px;width:19px;height:34px;background:linear-gradient(90deg,#c88e48,#ffe4a2,#c18a4a);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.tail.a{left:18px;transform:rotate(20deg)}.tail.b{right:17px;transform:rotate(-20deg)}
.magic{position:absolute;left:50%;top:105px;transform:translateX(-50%) scale(.2);width:210px;height:190px;border-radius:50%;background:radial-gradient(ellipse,#fff8cfdd 0%,#ffc5d9a3 22%,#ff91c95c 43%,transparent 71%);filter:blur(9px);opacity:0;z-index:2;pointer-events:none}.hint{color:#ffcfdd;font-size:14px;animation:pulse 1.9s infinite;margin:0 0 20px}.open .gift{animation:giftShake .62s ease-in-out both;pointer-events:none}.open .lid{animation:lidFly 1.3s .57s cubic-bezier(.15,.7,.22,1) forwards}.open .magic{animation:magicBloom 1.65s .66s ease-out forwards}.open .seal{animation:fadeAway .3s 1.03s forwards}.open .stage{height:265px}.message{display:none;margin:0 auto;background:linear-gradient(150deg,#fff9ef,#ffece9);color:#4b2937;padding:24px clamp(17px,4vw,32px) 30px;border-radius:21px;border:2px solid #f1c98f;box-shadow:0 20px 70px #0009,0 0 30px #ffb4d329;max-width:540px;line-height:1.9}.revealed .message{display:block;animation:letterReveal 1s cubic-bezier(.2,.8,.2,1) both}.party-art{display:block;width:100%;height:auto;max-height:570px;object-fit:contain;border-radius:13px;margin:4px auto 22px;box-shadow:0 9px 26px #7d38552f}.message h2{margin:0 0 14px;color:#ad2d58;font-size:clamp(23px,5vw,32px)}.message p{margin:13px 0}.message strong{color:#9c2452}.buttons{margin-top:25px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #f7c989;border-radius:999px;background:#8c284b;color:#fff5e8;padding:12px 21px;font-weight:700;cursor:pointer}button:hover{background:#af3d67}button:focus-visible{outline:3px solid #e5aa64;outline-offset:3px}.footer{font-size:12px;color:#e9aabf;margin-top:23px;opacity:.8}.spark{position:fixed;pointer-events:none;animation:fly 2.1s ease-out forwards;font-size:22px;z-index:20}.hide{display:none!important}@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes breathe{50%{transform:scale(1.14);opacity:.7}}@keyframes pulse{50%{opacity:.45}}@keyframes giftShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-4deg)}40%,80%{transform:translateX(8px) rotate(4deg)}}@keyframes lidFly{0%{transform:none;opacity:1}45%{transform:translate(-22px,-110px) rotate(-17deg);opacity:1}100%{transform:translate(5px,-225px) rotate(18deg);opacity:0}}@keyframes magicBloom{0%{opacity:0;transform:translateX(-50%) scale(.2)}35%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(2.3)}}@keyframes fadeAway{to{opacity:0}}@keyframes letterReveal{from{opacity:0;transform:translateY(45px) scale(.92)}to{opacity:1;transform:none}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@media(max-width:450px){.wrap{padding-top:34px}.stage{height:325px}.gift{transform:scale(.88);animation:float 3.4s ease-in-out infinite}.open .stage{height:240px}}@media(prefers-reduced-motion:reduce){.gift,.hint,.aura{animation:none}.open .gift{animation:none}.open .lid{animation:none;opacity:0}.open .magic{animation:none}.revealed .message{animation:none}}

.bgm-controls{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #f5d7a880;border-radius:999px;background:#32172de8;box-shadow:0 8px 24px #0006;backdrop-filter:blur(10px)}
.bgm-controls button{padding:7px 11px;font-size:12px;background:#7f294c}.bgm-controls input{width:78px;accent-color:#ffb6ca}
.bgm-controls label{font-size:11px;color:#ffe3cf}
@media(max-width:450px){.bgm-controls{right:8px;bottom:8px}.bgm-controls input{width:60px}}
</style></head><body><div class="ambient"></div><audio id="bgm" src="kataomoi.mp3" loop preload="metadata"></audio><div class="bgm-controls"><button type="button" id="bgm-toggle" aria-label="배경 음악 재생">♫ BGM OFF</button><label for="bgm-volume">음량</label><input id="bgm-volume" type="range" min="0" max="100" value="18" aria-label="배경 음악 음량"></div><main class="wrap" id="scene"><h1>✦ RUCHEL 400 DAYS ✦</h1><p class="sub">루체리에게 도착한 특별한 선물 🍓</p><div class="stage"><div class="aura"></div><div class="floor"></div><div class="magic"></div><div class="gift" id="gift" role="button" tabindex="0" aria-label="400일 기념 선물상자 열기"><div class="box-front"></div><div class="seal">🍓</div><div class="lid"><div class="lid-top"></div><div class="lid-front"></div><div class="bow"><div class="tail a"></div><div class="tail b"></div><div class="knot"></div></div></div></div></div><p class="hint" id="hint">✧ 선물상자를 눌러 열어봐! ✧</p><section class="message" id="message" aria-label="400일 축하 편지"><img class="party-art" src="ruchel-400-party.png" alt="루첼의 400일 기념 파티 일러스트"><h2>루체리 400일 축하해! 🍓♥️</h2><p>400일 동안 방송하느라 고생 많았어.<br>앞으로도 지금처럼 즐겁게 방송하고,<br>오래오래 함께하자!</p><p><strong>오늘도 새로운 것을 알게 되었네요.</strong><br>루체리는 역시 귀엽다는 것 ㅋㅋㅋ</p><div class="buttons"><button id="again" type="button">🎁 다시 열어보기</button><button id="more" type="button">✨ 축하 더 보내기</button></div></section><p class="footer">Made with ♥ for RUCHEL</p></main><script>
const scene=document.getElementById('scene'),gift=document.getElementById('gift'),hint=document.getElementById('hint'),message=document.getElementById('message');let timer=null;function sparkle(n=45,origin=gift){const r=origin.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=['🍓','♥','✨','✦','💗','⭐'][Math.floor(Math.random()*6)];s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--x',((Math.random()-.5)*Math.min(innerWidth*.9,740))+'px');s.style.setProperty('--y',((Math.random()-.5)*560-80)+'px');s.style.setProperty('--r',((Math.random()-.5)*900)+'deg');s.style.animationDelay=(Math.random()*.42)+'s';document.body.append(s);setTimeout(()=>s.remove(),2700)}}function openGift(){if(scene.classList.contains('open'))return;startBgm();scene.classList.add('open');gift.setAttribute('aria-disabled','true');hint.classList.add('hide');setTimeout(()=>sparkle(55),680);timer=setTimeout(()=>{scene.classList.add('revealed');message.scrollIntoView({behavior:'smooth',block:'nearest'})},1750)}gift.addEventListener('click',openGift);gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});document.getElementById('again').addEventListener('click',()=>{clearTimeout(timer);scene.classList.remove('revealed','open');gift.removeAttribute('aria-disabled');hint.classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});gift.focus({preventScroll:true})});document.getElementById('more').addEventListener('click',e=>sparkle(65,e.currentTarget));
const bgm=document.getElementById('bgm'),bgmToggle=document.getElementById('bgm-toggle'),bgmVolume=document.getElementById('bgm-volume');bgm.volume=.18;
function updateBgm(){bgmToggle.textContent=bgm.paused?'♫ BGM OFF':'♫ BGM ON';bgmToggle.setAttribute('aria-label',bgm.paused?'배경 음악 재생':'배경 음악 일시정지')}
function startBgm(){if(bgm.paused)bgm.play().then(updateBgm).catch(updateBgm)}
bgmToggle.addEventListener('click',()=>{if(bgm.paused){startBgm()}else{bgm.pause();updateBgm()}});
bgmVolume.addEventListener('input',()=>{bgm.volume=Number(bgmVolume.value)/100});
bgm.addEventListener('play',updateBgm);bgm.addEventListener('pause',updateBgm);updateBgm();
</script></body></html>
