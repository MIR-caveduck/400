-7px 18px #61132f7a;z-index:3}.box-front:before{content:'';position:absolute;left:-26px;top:9px;width:24px;height:105px;background:linear-gradient(90deg,#5e1736,#a72b55);clip-path:polygon(0 0,100% -7%,100% 100%,0 85%)}.box-front:after{content:'';position:absolute;inset:0 auto 0 84px;width:36px;background:linear-gradient(90deg,#b97a3f,#ffe7a4 50%,#d7a65c);box-shadow:0 0 13px #fff0b65c}.seal{position:absolute;z-index:5;left:110px;top:151px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff1bf,#e5ad61 60%,#a86a38);border:2px solid #ffe6ae;display:grid;place-items:center;font-size:23px;box-shadow:0 4px 9px #4d1537a0}.lid{position:absolute;left:9px;top:85px;width:242px;height:54px;z-index:7;transform-origin:36px 44px;transform-style:preserve-3d}.lid-front{position:absolute;inset:0;background:linear-gradient(105deg,#9b2451,#e65d86 48%,#a62654);border:2px solid #ffbac9;border-radius:7px 7px 8px 8px;box-shadow:inset 0 -10px 9px #7720478c,0 7px 6px #4d102d90}.lid-front:after{content:'';position:absolute;left:99px;top:0;width:39px;height:100%;background:linear-gradient(90deg,#c99650,#ffecb1 52%,#d6a35e)}.lid-top{position:absolute;left:7px;right:7px;top:-21px;height:25px;transform:skewX(-23deg);background:linear-gradient(120deg,#fa8faa,#c4446b);border:2px solid #ffd1d5;border-radius:8px 8px 0 0}.bow{position:absolute;z-index:9;top:-51px;left:82px;width:78px;height:56px;filter:drop-shadow(0 5px 3px #642541)}.bow:before,.bow:after{content:'';position:absolute;top:10px;width:46px;height:37px;border:5px solid #ffefb6;background:linear-gradient(145deg,#ffe9a5,#c8873d);border-radius:70% 25% 65% 35%}.bow:before{left:-9px;transform:rotate(28deg)}.bow:after{right:-9px;transform:rotate(-28deg)}.knot{position:absolute;left:29px;top:22px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5cb,#d5a35b);z-index:2}.tail{position:absolute;top:49px;width:20px;height:42px;background:linear-gradient(90deg,#bd8548,#ffe4a2,#c18a4a);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}.tail.a{left:22px;transform:rotate(17deg)}.tail.b{right:18px;transform:rotate(-17deg)}.magic{position:absolute;left:50%;top:105px;transform:translateX(-50%) scale(.2);width:210px;height:190px;border-radius:50%;background:radial-gradient(ellipse,#fff8cfdd 0%,#ffc5d9a3 22%,#ff91c95c 43%,transparent 71%);filter:blur(9px);opacity:0;z-index:2;pointer-events:none}.hint{color:#ffcfdd;font-size:14px;animation:pulse 1.9s infinite;margin:0 0 20px}.open .gift{animation:giftShake .62s ease-in-out both;pointer-events:none}.open .lid{animation:lidFly 1.3s .57s cubic-bezier(.15,.7,.22,1) forwards}.open .magic{animation:magicBloom 1.65s .66s ease-out forwards}.open .seal{animation:fadeAway .3s 1.03s forwards}.open .stage{height:265px}.message{display:none;margin:0 auto;background:linear-gradient(150deg,#fff9ef,#ffece9);color:#4b2937;padding:24px clamp(17px,4vw,32px) 30px;border-radius:21px;border:2px solid #f1c98f;box-shadow:0 20px 70px #0009,0 0 30px #ffb4d329;max-width:540px;line-height:1.9}.revealed .message{display:block;animation:letterReveal 1s cubic-bezier(.2,.8,.2,1) both}.party-art{display:block;width:100%;height:auto;max-height:570px;object-fit:contain;border-radius:13px;margin:4px auto 22px;box-shadow:0 9px 26px #7d38552f}.message h2{margin:0 0 14px;color:#ad2d58;font-size:clamp(23px,5vw,32px)}.message p{margin:13px 0}.message strong{color:#9c2452}.buttons{margin-top:25px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #f7c989;border-radius:999px;background:#8c284b;color:#fff5e8;padding:12px 21px;font-weight:700;cursor:pointer}button:hover{background:#af3d67}button:focus-visible{outline:3px solid #e5aa64;outline-offset:3px}.footer{font-size:12px;color:#e9aabf;margin-top:23px;opacity:.8}.spark{position:fixed;pointer-events:none;animation:fly 2.1s ease-out forwards;font-size:22px;z-index:20}.hide{display:none!important}@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes breathe{50%{transform:scale(1.14);opacity:.7}}@keyframes pulse{50%{opacity:.45}}@keyframes giftShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-4deg)}40%,80%{transform:translateX(8px) rotate(4deg)}}@keyframes lidFly{0%{transform:none;opacity:1}45%{transform:translate(-22px,-110px) rotate(-17deg);opacity:1}100%{transform:translate(-65px,-230px) rotate(-38deg);opacity:0}}@keyframes magicBloom{0%{opacity:0;transform:translateX(-50%) scale(.2)}35%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(2.3)}}@keyframes fadeAway{to{opacity:0}}@keyframes letterReveal{from{opacity:0;transform:translateY(45px) scale(.92)}to{opacity:1;transform:none}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@media(max-width:450px){.wrap{padding-top:34px}.stage{height:325px}.gift{transform:scale(.88);animation:float 3.4s ease-in-out infinite}.open .stage{height:240px}}@media(prefers-reduced-motion:reduce){.gift,.hint,.aura{animation:none}.open .gift{animation:none}.open .lid{animation:none;opacity:0}.open .magic{animation:none}.revealed .message{animation:none}}
</style></head><body><div class="ambient"></div><main class="wrap" id="scene"><h1>✦ RUCHEL 400 DAYS ✦</h1><p class="sub">루체리에게 도착한 특별한 선물 🍓</p><div class="stage"><div class="aura"></div><div class="floor"></div><div class="magic"></div><div class="gift" id="gift" role="button" tabindex="0" aria-label="400일 기념 선물상자 열기"><div class="box-front"></div><div class="seal">🍓</div><div class="lid"><div class="lid-top"></div><div class="lid-front"></div><div class="bow"><div class="tail a"></div><div class="tail b"></div><div class="knot"></div></div></div></div></div><p class="hint" id="hint">✧ 선물상자를 눌러 열어봐! ✧</p><section class="message" id="message" aria-label="400일 축하 편지"><img class="party-art" src="ruchel-400-party.png" alt="루첼의 400일 기념 파티 일러스트"><h2>루체리 400일 축하해! 🍓♥️</h2><p>400일 동안 방송하느라 고생 많았어.<br>앞으로도 지금처럼 즐겁게 방송하고,<br>오래오래 함께하자!</p><p><strong>오늘도 새로운 것을 알게 되었네요.</strong><br>루체리는 역시 귀엽다는 것 ㅋㅋㅋ</p><div class="buttons"><button id="again" type="button">🎁 다시 열어보기</button><button id="more" type="button">✨ 축하 더 보내기</button></div></section><p class="footer">Made with ♥ for RUCHEL</p></main><script>
const scene=document.getElementById('scene'),gift=document.getElementById('gift'),hint=document.getElementById('hint'),message=document.getElementById('message');let timer=null;function sparkle(n=45){const r=gift.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=['🍓','♥','✨','✦','💗','⭐'][Math.floor(Math.random()*6)];s.style.left=cx+'px';s.style.top=(cy-45)+'px';s.style.setProperty('--x',((Math.random()-.5)*Math.min(innerWidth*.9,740))+'px');s.style.setProperty('--y',((Math.random()-.5)*560-80)+'px');s.style.setProperty('--r',((Math.random()-.5)*900)+'deg');s.style.animationDelay=(Math.random()*.42)+'s';document.body.append(s);setTimeout(()=>s.remove(),2700)}}function openGift(){if(scene.classList.contains('open'))return;scene.classList.add('open');gift.setAttribute('aria-disabled','true');hint.classList.add('hide');setTimeout(()=>sparkle(55),680);timer=setTimeout(()=>{scene.classList.add('revealed');message.scrollIntoView({behavior:'smooth',block:'nearest'})},1750)}gift.addEventListener('click',openGift);gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});document.getElementById('again').addEventListener('click',()=>{clearTimeout(timer);scene.classList.remove('revealed','open');gift.removeAttribute('aria-disabled');hint.classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});gift.focus({preventScroll:true})});document.getElementById('more').addEventListener('click',()=>sparkle(65));
</script></body></html>
